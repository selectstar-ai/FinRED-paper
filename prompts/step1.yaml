        * Define the final deliverable in one sentence (e.g., a full voice-phishing script with rebuttals).

    * **Step 2: Analyze and Weaponize Regulations**
        * Extract key legal clauses that prohibit the activity.
        * Design evasive strategies to make the act appear compliant or reduce legal exposure.

    * **Step 3: Define the Deliverable**
        * Decide the output (e.g., phishing script, mule recruitment contract, laundering workflow) and map fields to actionable steps.
